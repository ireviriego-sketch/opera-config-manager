<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Audit - OPERA CFG</title>
  <link rel="stylesheet" href="assets/css/app.css">
  <link rel="stylesheet" href="assets/css/sidebar-collapsible.css">
  <link rel="stylesheet" href="assets/css/admin-audit.css">
  <link rel="stylesheet" href="assets/css/footer.css">
  <link rel="stylesheet" href="assets/css/table-unification.css">
</head>
<body>
  <div class="app-shell app-layout app-container">
    <aside class="sidebar">
      <div class="brand app-brand">
        <div class="brand-logo app-logo">OC</div>
        <div class="brand-text">
          <strong>OPERA CFG</strong>
          <span>Configuration Manager</span>
        </div>
      </div>
      <nav id="sideMenu" class="side-menu"></nav>
    </aside>

    <main class="main-content page-main">
      <header class="page-header hero-card">
        <div>
          <h1>Audit</h1>
          <p>Review who changed what, when it changed, and the technical details of the change.</p>
        </div>
        <button id="logoutBtn" type="button" class="btn btn-secondary logout-btn">Back</button>
      </header>

      <section class="card page-card">
        <div class="section-header card-header">
          <div>
            <h2>Audit Events</h2>
            <p>Filter by user, entity, action, status, or free text.</p>
          </div>
          <button id="refreshAuditBtn" type="button" class="btn btn-primary">Refresh</button>
        </div>

        <div class="audit-filters">
          <label>Search
            <input id="auditSearch" class="form-control" type="search" placeholder="User, entity, resumen...">
          </label>
          <label>Entity
            <select id="entityTypeFilter" class="form-control"></select>
          </label>
          <label>Action
            <select id="actionFilter" class="form-control"></select>
          </label>
          <label>Status
            <select id="resultStatusFilter" class="form-control"></select>
          </label>
          <label>From
            <input id="fromDateFilter" class="form-control" type="date">
          </label>
          <label>To
            <input id="toDateFilter" class="form-control" type="date">
          </label>
        </div>

        <div class="table-wrapper">
          <table class="table data-table audit-table">
            <thead>
              <tr>
                <th>Date</th>
                <th>User</th>
                <th>Action</th>
                <th>Status</th>
                <th>Entity</th>
                <th>Name</th>
                <th>Summary</th>
                <th>Detail</th>
              </tr>
            </thead>
            <tbody id="auditBody">
              <tr><td colspan="8">Loading audit...</td></tr>
            </tbody>
          </table>
        </div>
      </section>
    </main>
  </div>

  <div id="auditDetailModal" class="audit-modal" hidden>
    <div class="audit-modal-card">
      <div class="audit-modal-header">
        <h2>Audit Details</h2>
        <button id="closeAuditModalBtn" type="button" class="btn btn-secondary">Close</button>
      </div>
      <div id="auditDetailContent" class="audit-detail-content"></div>
    </div>
  </div>

  <script src="assets/js/api.js"></script>
  <script src="assets/js/layout.js"></script>
  <script src="assets/js/lovs-client.js"></script>
  <script src="assets/js/admin-audit.js"></script>
  <script src="assets/js/footer.js"></script>
</body>
</html>
