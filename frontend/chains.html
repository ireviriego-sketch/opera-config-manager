<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>OPERA CFG - Chains</title>
  <link rel="stylesheet" href="assets/css/app.css" />
  <link rel="stylesheet" href="assets/css/chains.css" />
  <link rel="stylesheet" href="assets/css/footer.css">
  <link rel="stylesheet" href="assets/css/modal-unification.css">
  <link rel="icon" href="assets/img/accenture-greater.svg" type="image/svg+xml" />
</head>
<body>
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">OC</div>
      <div>
        <h2>OPERA CFG</h2>
        <span>Configuration Manager</span>
      </div>
    </div>
    <nav id="sideMenu" class="side-menu"></nav>
  </aside>

  <main class="main">
    <header class="topbar">
      <div>
        <h1>Hotel Chains</h1>
        <p>Review, create, and manage hotel chains and associated hotels.</p>
      </div>
      <div class="page-actions">
        <button id="logoutBtn" class="secondary" type="button">Back</button>
        <button id="refreshBtn" class="secondary">Refresh</button>
        <button id="newChainBtn" class="primary">New Chain</button>
      </div>
    </header>

    <section class="content-card">
      <div class="toolbar">
        <input id="searchInput" class="input" placeholder="Search by code or name" />
      </div>
      <div id="chainsContainer" class="chains-grid"></div>
    </section>
  </main>

  <div id="chainModal" class="modal hidden">
    <div class="modal-card">
      <div class="modal-header">
        <h2>New Chain</h2>
        <button id="closeModalBtn" class="link-button" type="button">Close</button>
      </div>
      <form id="chainForm" class="form-grid" novalidate>
        <label>CHAIN_CODE *<input id="chainCodeInput" class="input" maxlength="50" /></label>
        <label>CHAIN_NAME *<input id="chainNameInput" class="input" maxlength="200" /></label>
        <label>STATUS *
          <select id="chainStatusInput" class="input"></select>
        </label>
        <div class="form-actions">
          <button class="primary" type="submit">Save</button>
        </div>
      </form>
    </div>
  </div>

  <div id="messageModal" class="modal hidden">
    <div class="modal-card">
      <div class="modal-header">
        <h2 id="messageTitle">Notice</h2>
        <button id="closeMessageBtn" class="link-button" type="button">Close</button>
      </div>
      <div id="messageBody"></div>
    </div>
  </div>

  <script src="assets/js/api.js"></script>
  <script src="assets/js/layout.js"></script>
  <script src="assets/js/chains-api.js"></script>
  <script src="assets/js/lovs-client.js"></script>
  <script src="assets/js/chains.js"></script>
  <script src="assets/js/footer.js"></script>
</body>
</html>
