<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>OPERA CFG - Deployment Designer</title>
  <link rel="stylesheet" href="assets/css/app.css" />
  <link rel="stylesheet" href="assets/css/deployment-designer.css" />
  <link rel="stylesheet" href="assets/css/footer.css">
  <link rel="stylesheet" href="assets/css/canvas-modeling-unification.css">
  <link rel="stylesheet" href="assets/css/modal-unification.css">
  <link rel="icon" href="assets/img/accenture-greater.svg" type="image/svg+xml" />
</head>
<body>
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">OC</div>
      <div>
        <h2>OPERA CFG</h2>
        <span>Configuration Manager</span>
      </div>
    </div>
    <nav id="sideMenu" class="side-menu"></nav>
  </aside>

  <main class="main designer-main">
    <header class="topbar designer-topbar">
      <div>
        <p class="kicker">Deployment Designer</p>
        <h1 id="designerTitle">OPERA Deployment</h1>
        <p id="designerSubtitle">Visual copy of the template to load functional data.</p>
      </div>
      <div class="page-actions">
        <button id="backBtn" class="secondary" type="button">Back</button>
        <button id="refreshBtn" class="secondary" type="button">Refresh</button>
        <button id="exportAllBtn" class="secondary" type="button">Export JSON</button>
      </div>
    </header>

    <section class="designer-layout">
      <aside class="designer-left-panel">
        <div class="panel-title-row">
          <h2>Domains</h2>
          <span id="domainCountBadge" class="count-badge">0</span>
        </div>
        <div id="domainList" class="domain-list"></div>
      </aside>

      <section class="designer-canvas-panel">
        <div class="canvas-toolbar">
          <div>
            <h2 id="canvasTitle">Visual View</h2>
            <p id="canvasHint" class="muted">Double-click an entity to load data.</p>
          </div>
          <div class="page-actions">
            <button id="fitCanvasBtn" class="secondary small" type="button">Rearrange</button>
          </div>
        </div>
        <div id="canvasWrapper" class="canvas-wrapper">
          <svg id="relationshipLayer" class="relationship-layer"></svg>
          <div id="canvas" class="deployment-canvas"></div>
        </div>
      </section>
    </section>
  </main>

  <aside id="entityDrawer" class="entity-drawer hidden">
    <div class="drawer-header">
      <div>
        <p id="drawerDomain" class="kicker">Domain</p>
        <h2 id="drawerTitle">Entity</h2>
        <p id="drawerSubtitle" class="muted">Deployment attributes and records.</p>
      </div>
      <button id="closeDrawerBtn" class="link-button" type="button">Close</button>
    </div>

    <section class="drawer-section">
      <div class="section-title-row">
        <h3>Attributes</h3>
        <span id="attributeCountBadge" class="count-badge">0</span>
      </div>
      <div id="attributeList" class="attribute-list"></div>
    </section>

    <section class="drawer-section">
      <div class="section-title-row">
        <h3>Records</h3>
        <div class="page-actions">
          <button id="newRecordBtn" class="primary small" type="button">New</button>
          <button id="importExcelBtn" class="secondary small" type="button">Import Excel</button>
          <button id="exportExcelBtn" class="secondary small" type="button">Export Excel</button>
        </div>
      </div>
      <div id="recordsContainer" class="records-container"></div>
    </section>
  </aside>

  <div id="recordModal" class="modal hidden">
    <div class="modal-card modal-card-wide">
      <div class="modal-header">
        <h2 id="recordModalTitle">New Record</h2>
        <button id="closeRecordModalBtn" class="link-button" type="button">Close</button>
      </div>
      <form id="recordForm" class="record-form" novalidate></form>
    </div>
  </div>

  <div id="messageModal" class="modal hidden">
    <div class="modal-card">
      <div class="modal-header">
        <h2 id="messageTitle">Notice</h2>
        <button id="closeMessageBtn" class="link-button" type="button">Close</button>
      </div>
      <div id="messageBody"></div>
    </div>
  </div>

  <script src="assets/js/api.js"></script>
  <script src="assets/js/layout.js"></script>
  <script src="assets/js/deployment-designer-api.js"></script>
  <script src="assets/js/deployment-designer.js"></script>
  <script src="assets/js/footer.js"></script>
</body>
</html>
