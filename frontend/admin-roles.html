<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Roles - OPERA CFG</title>
  <link rel="stylesheet" href="assets/css/app.css">
  <link rel="stylesheet" href="assets/css/footer.css">
  <link rel="stylesheet" href="assets/css/table-unification.css">
</head>
<body>
  <div class="app-shell app-layout app-container">
    <aside class="sidebar">
      <div class="brand app-brand">
        <div class="brand-logo app-logo">OC</div>
        <div class="brand-text">
          <strong>OPERA CFG</strong>
          <span>Configuration Manager</span>
        </div>
      </div>
      <nav id="sideMenu" class="side-menu"></nav>
    </aside>

    <main class="main-content page-main">
      <header class="page-header hero-card">
        <div>
          <h1>Role Administration</h1>
          <p>OPERA CFG functional roles.</p>
        </div>
        <button id="logoutBtn" type="button" class="btn btn-secondary logout-btn">Back</button>
      </header>

      <section class="card page-card">
        <div class="section-header card-header">
          <div>
            <h2>Roles</h2>
            <p>ADMIN administers the tool. CHAIN_MANAGER and HOTEL_MANAGER require explicit permissions by chain or hotel.</p>
          </div>
          <button id="refreshRolesBtn" type="button" class="btn btn-primary">Refresh</button>
        </div>

        <div class="toolbar table-toolbar">
          <input id="roleSearch" class="form-control" type="search" placeholder="Search rol">
        </div>

        <div class="table-wrapper">
          <table class="table data-table">
            <thead>
              <tr>
                <th>Code</th>
                <th>Name</th>
                <th>Description</th>
                <th>System</th>
                <th>Users</th>
                <th>Permissions</th>
                <th>Updated</th>
              </tr>
            </thead>
            <tbody id="rolesBody">
              <tr><td colspan="7">Loading roles...</td></tr>
            </tbody>
          </table>
        </div>
      </section>
    </main>
  </div>

  <script src="assets/js/api.js"></script>
  <script src="assets/js/layout.js"></script>
  <script src="assets/js/admin-roles.js"></script>
  <script src="assets/js/footer.js"></script>
</body>
</html>
