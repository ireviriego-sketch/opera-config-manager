<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>OPERA CFG - Deployment Content</title>
  <link rel="stylesheet" href="assets/css/app.css" />
  <link rel="stylesheet" href="assets/css/deployment-content.css" />
  <link rel="stylesheet" href="assets/css/footer.css">
  <link rel="stylesheet" href="assets/css/modal-unification.css">
  <link rel="icon" href="assets/img/accenture-greater.svg" type="image/svg+xml" />
</head>
<body>
  <aside class="sidebar">
    <div class="brand"><div class="brand-mark">OC</div><div><h2>OPERA CFG</h2><span>Configuration Manager</span></div></div>
    <nav id="sideMenu" class="side-menu"></nav>
  </aside>

  <main class="main">
    <header class="topbar">
      <div><h1>Deployment Content</h1><p id="pageSubtitle">Domains, entities, and records to be deployed.</p></div>
      <div class="page-actions">
        <button id="logoutBtn" class="secondary" type="button">Back</button>
        <button id="backBtn" class="secondary" type="button">Back</button>
        <button id="refreshBtn" class="secondary" type="button">Refresh</button>
      </div>
    </header>

    <section class="content-grid-page">
      <div id="globalSearchContainer"></div>
      <p id="searchResultsLabel" class="search-results-label"></p>
      <div id="structureContainer" class="structure-grid"></div>
    </section>
  </main>

  <!-- Modal importar Excel -->
  <div id="importModal" class="modal hidden">
    <div class="modal-card">
      <div class="modal-header">
        <h2 id="importModalTitle">Import Excel</h2>
        <button id="closeImportModalBtn" class="link-button" type="button">Close</button>
      </div>
      <p class="muted" style="margin:12px 0 8px">Select an Excel file (.xlsx). Each sheet must have the entity name and columns must match the defined attributes.</p>
      <form id="importForm" novalidate>
        <label style="display:flex;flex-direction:column;gap:6px;font-weight:800;font-size:13px;margin-bottom:14px">
          Excel File (.xlsx)
          <input id="importFileInput" type="file" accept=".xlsx" class="input" required />
        </label>
        <div class="form-actions" style="display:flex;gap:10px;align-items:center">
          <button id="importSubmitBtn" class="primary" type="submit">Import</button>
          <span id="importStatus" style="font-size:13px"></span>
        </div>
      </form>
      <div id="importPreview"></div>
    </div>
  </div>

  <!-- Modal mensaje -->
  <div id="messageModal" class="modal hidden">
    <div class="modal-card">
      <div class="modal-header">
        <h2 id="messageTitle">Notice</h2>
        <button id="closeMessageBtn" class="link-button" type="button">Close</button>
      </div>
      <div id="messageBody"></div>
    </div>
  </div>

  <script src="assets/js/api.js"></script>
  <script src="assets/js/layout.js"></script>
  <script src="assets/js/deployment-content-api.js"></script>
  <script src="assets/js/deployment-content.js"></script>
  <script src="assets/js/footer.js"></script>
</body>
</html>
