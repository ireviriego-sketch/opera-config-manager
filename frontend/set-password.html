<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create Password - OPERA CFG</title>
  <link rel="stylesheet" href="assets/css/app.css">
  <link rel="stylesheet" href="assets/css/admin-access.css">
</head>
<body>
  <main class="password-reset-page">
    <section class="password-reset-card card">
      <div class="brand app-brand">
        <div class="brand-logo app-logo">OC</div>
        <div class="brand-text">
          <strong>OPERA CFG</strong>
          <span>Create Password</span>
        </div>
      </div>

      <h1>Create Password</h1>
      <p id="tokenStatus">Validating link...</p>

      <form id="setPasswordForm" hidden>
        <label>New Password
          <input id="password" class="form-control" type="password" minlength="8" required autocomplete="new-password">
        </label>
        <label>Confirm Password
          <input id="passwordConfirm" class="form-control" type="password" minlength="8" required autocomplete="new-password">
        </label>
        <button type="submit" class="btn btn-primary">Save Password</button>
      </form>

      <p id="setPasswordMessage"></p>
      <a id="loginLink" href="login.html" hidden>Go to Login</a>
    </section>
  </main>
  <script src="assets/js/set-password.js"></script>
</body>
</html>
