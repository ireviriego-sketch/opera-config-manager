<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>OPERA Config Manager - Login</title>
  <link rel="stylesheet" href="assets/css/app.css" />
  <link rel="icon" href="assets/img/accenture-greater.svg" type="image/svg+xml" />
</head>
<body class="login-page">
  <main class="login-card">
    <div class="login-brand">OPERA CFG</div>
    <h1>OPERA Config Manager</h1>
    <p>Access to the OPERA Cloud configuration platform</p>
    <form id="loginForm">
      <label for="username">User</label>
      <input id="username" autocomplete="username" required />
      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password" required />
      <button type="submit">Sign in</button>
      <div id="loginMessage" class="message"></div>
    </form>
  </main>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/login.js"></script>
</body>
</html>
