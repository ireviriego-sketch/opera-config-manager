<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>OPERA CFG - Entity</title>
  <link rel="stylesheet" href="assets/css/app.css" />
  <link rel="stylesheet" href="assets/css/deployment-entity.css" />
  <link rel="stylesheet" href="assets/css/footer.css">
  <link rel="stylesheet" href="assets/css/modal-unification.css">
</head>
<body>
  <aside class="sidebar">
    <div class="brand"><div class="brand-mark">OC</div><div><h2>OPERA CFG</h2><span>Configuration Manager</span></div></div>
    <nav id="sideMenu" class="side-menu"></nav>
  </aside>

  <main class="main">
    <header class="topbar">
      <div>
        <h1 id="entityTitle">Loading...</h1>
        <p id="entitySubtitle" class="muted"></p>
      </div>
      <div class="page-actions">
        <button id="logoutBtn" class="secondary" type="button">Back</button>
        <div id="importCounter"></div>
        <button id="importOperaBtn" class="opera-import-btn" type="button">
          ☁️ Export to OPERA Cloud
        </button>
        <button id="backBtn" class="secondary" type="button">Back</button>
        <button id="newRecordBtn" class="primary" type="button">New Record</button>
      </div>
    </header>

    <section class="entity-page">
      <div id="searchContainer"></div>
      <div id="recordsContainer"></div>
    </section>
  </main>

  <!-- Modal record -->
  <div id="recordModal" class="modal hidden">
    <div class="modal-card modal-card-wide">
      <div class="modal-header">
        <h2 id="recordModalTitle">New Record</h2>
        <button id="closeRecordModalBtn" class="link-button" type="button">Close</button>
      </div>
      <form id="recordForm" class="record-form" novalidate></form>
    </div>
  </div>

  <!-- Modal mensaje -->
  <div id="messageModal" class="modal hidden">
    <div class="modal-card">
      <div class="modal-header">
        <h2 id="messageTitle">Notice</h2>
        <button id="closeMessageBtn" class="link-button" type="button">Close</button>
      </div>
      <div id="messageBody"></div>
    </div>
  </div>

  <script src="assets/js/api.js"></script>
  <script src="assets/js/layout.js"></script>
  <script src="assets/js/deployment-content-api.js"></script>
  <script src="assets/js/deployment-entity.js"></script>
  <script src="assets/js/footer.js"></script>
</body>
</html>
